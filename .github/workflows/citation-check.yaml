# Checks that every DOI this package cites still resolves.
#
# Citations go stale without anyone touching them. Data centres reissue a DOI
# when a record is superseded and retire the old one, so a reference that was
# correct when written stops resolving on its own. This package has already
# shipped one such: the AMOC reference pointed at a RAPID DOI that BODC retired
# when it published a newer version of the series.
#
# Nothing in the package resolves a DOI at runtime, so nothing would ever notice.
# Hence a scheduled check rather than a test.
#
# It only reads. Replacing a dead citation means choosing which version of a
# record the package should track, which is a judgement rather than a lookup.

name: Citation check

on:
  schedule:
    # 07:00 UTC on the first of each quarter. DOIs are retired on the timescale
    # of dataset releases - roughly yearly - so monthly would mostly be noise.
    - cron: "0 7 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::curl
            any::jsonlite
            any::pkgload
          needs: check

      - name: Check the citations
        id: check
        run: |
          set +e
          Rscript inst/scripts/check_citations.R --markdown citations.md --json citations.json
          echo "status=$?" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-report
          path: |
            citations.md
            citations.json
          if-no-files-found: ignore

      # Exit 2 is "no DOI resolved at all", which is a network problem rather
      # than a citation problem. Filing an issue for it would train everyone to
      # ignore these.
      - name: Report an unreachable network
        if: steps.check.outputs.status == '2'
        run: |
          echo "::warning::Could not resolve any DOI; no citation conclusion drawn."

      - name: Open or update an issue
        if: steps.check.outputs.status == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('citations.md', 'utf8');
            const title = 'A cited DOI no longer resolves';

            // One rolling issue rather than a new one each quarter, so a
            // citation left unfixed does not accumulate duplicates.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'citations',
            });

            const footer = `\n\n---\n_Checked by [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) on ${new Date().toISOString().slice(0, 10)}._`;

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body + footer,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: body + footer,
                labels: ['citations'],
              });
            }
