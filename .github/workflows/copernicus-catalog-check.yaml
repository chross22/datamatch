# Watches the live Copernicus Marine catalogue for drift away from the
# identifiers hard-coded in R/variables.R.
#
# Copernicus revises dataset identifiers periodically: a new version of a
# reanalysis gets a new id and the old one is retired. Nothing in the package
# notices until someone's fetch fails, and it fails as an opaque
# unknown-dataset error from the CLI rather than as anything pointing at a stale
# catalog entry. This turns that into an issue filed before anyone hits it.
#
# The check only reads the catalogue. It does not edit R/variables.R, because
# choosing the successor to a retired dataset is a judgement about versions and
# coverage rather than a lookup - see inst/scripts/check_catalog.R.

name: Copernicus catalog check

on:
  schedule:
    # 06:00 UTC on the first of each month. Identifiers change on the order of
    # once or twice a year, so daily runs would be noise.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The catalogue is public: `describe` needs no Copernicus account, so this
      # workflow needs no secrets. Only the download commands require sign-in.
      - name: Install the Copernicus Marine client
        run: pip install copernicusmarine

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::jsonlite
            any::pkgload
          needs: check

      - name: Check the catalog
        id: check
        run: |
          set +e
          Rscript inst/scripts/check_catalog.R --markdown drift.md --json drift.json
          echo "status=$?" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-drift-report
          path: |
            drift.md
            drift.json
          if-no-files-found: ignore

      # Exit 2 means the catalogue could not be reached, which is not drift.
      # Filing an issue for it would train everyone to ignore these.
      - name: Report an unreachable catalogue
        if: steps.check.outputs.status == '2'
        run: |
          echo "::warning::Could not reach the Copernicus catalogue; no drift conclusion drawn."

      - name: Open or update an issue
        if: steps.check.outputs.status == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift.md', 'utf8');
            const title = 'Copernicus catalog drift detected';

            // One rolling issue rather than a new one each month, so a drift
            // that goes unfixed does not accumulate duplicates.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'catalog-drift',
            });

            const footer = `\n\n---\n_Checked by [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) on ${new Date().toISOString().slice(0, 10)}._`;

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body + footer,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: body + footer,
                labels: ['catalog-drift'],
              });
            }
