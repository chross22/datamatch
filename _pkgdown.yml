# Served from camilleross.org/datamatch/, not chross22.github.io: GitHub applies
# the user site's custom domain to every project page on the account. This must
# name where visitors actually land, or the canonical link, sitemap and og:url
# all point at a hostname nobody uses and search engines see two of each page.
url: https://camilleross.org/datamatch/

template:
  bootstrap: 5
  light-switch: true

reference:
- title: Fetching data
  desc: >
    Seven sources behind one interface, sharing one set of variable names, and
    all returning the same shape. A value of the same name from two of them is
    not the same number - each function's help says what its source is and is
    not good for.
  contents:
  - accessCopernicus
  - accessEnvDat
  - accessFVCOM
  - accessHYCOM
  - accessCEFI
  - accessCCMP
  - accessERDDAP
  - accessOBDAAC
  - fill_satellite_gaps
  - forecast_variables

- title: Matching
  desc: >
    The spatiotemporal nearest-feature join, the columns it adds, and where each
    value came from.
  contents:
  - matchData
  - covariate_columns
  - source_of
  - write_eml

- title: Resampling
  desc: >
    Moving between grids and time steps. Aggregating loses detail, which is the
    safe direction; interpolating adds cells, not information.
  contents:
  - upscale_grid
  - downscale_grid
  - upscale_time
  - downscale_time
  - grid_resolution

- title: Seafloor terrain
  desc: >
    Depth, slope, aspect, and TPI from NOAA ETOPO.
  contents:
  - fetch_bathymetry
  - attach_bathymetry
  - bathymetry_variables

- title: Climate indices
  desc: >
    Basin-scale indices, their units, and the cache that expires on each
    provider's publishing cadence.
  contents:
  - fetch_climate_index
  - attach_climate_index
  - climate_indices
  - index_dictionary
  - climate_index_status
  - refresh_climate_index

- title: Plotting
  desc: >
    Base-graphics views of what was downloaded and what it matched to. Each
    returns the data it drew.
  contents:
  - plot_env
  - plot_coverage
  - plot_series
  - plot_matched
  - plot_mesh

- title: Catalogs and lookup
  desc: >
    What each source offers, which dataset or archive a variable comes from, and
    where it is documented.
  contents:
  - variable_dictionary
  - variable_dataset
  - copernicus_variables
  - fvcom_variables
  - fvcom_dictionary
  - fvcom_archives
  - fvcom_archive
  - fvcom_mesh
  - hycom_variables
  - hycom_dictionary
  - hycom_archives
  - hycom_covering
  - cefi_variables
  - cefi_dictionary
  - cefi_archives
  - cefi_archive
  - ccmp_variables
  - ccmp_dictionary
  - ccmp_versions
  - erddap_datasets
  - erddap_dataset
  - erddap_dictionary
  - obdaac_variables
  - obdaac_dictionary
  - obdaac_sensors
  - product_url
  - as_markdown

articles:
- title: Articles
  navbar: ~
  contents:
  - datamatch
  - sources
  - working-with-data
  - covariates
